#
# Reference physical-design runs for the PD track: harden alu_top with LibreLane
# on SKY130 for each adder option and a few clock periods, then publish the
# stage snapshots, metrics and signoff reports to the `reference-run` branch.
name: Reference PD run

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "files/alu/rtl/**"
      - "files/alu/pd/**"
      - ".github/workflows/reference-run.yml"

permissions:
  contents: write

concurrency:
  group: reference-run
  cancel-in-progress: true

env:
  LIBRELANE_VERSION: "3.0.14"

jobs:
  harden:
    name: ${{ matrix.adder }} at ${{ matrix.period }} ns
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { adder: rca,  period: "10" }
          - { adder: cla,  period: "10" }
          - { adder: csel, period: "10" }
          - { adder: rca,  period: "5" }
          - { adder: rca,  period: "4" }
          - { adder: cla,  period: "4" }
          - { adder: csel, period: "4" }
          - { adder: rca,  period: "3" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install LibreLane
        run: pip install "librelane==${LIBRELANE_VERSION}"

      - name: Write the config for this run
        working-directory: files/alu/pd
        run: |
          echo "CONFIG=$(python3 make_config.py ${{ matrix.adder }} ${{ matrix.period }})" >> "$GITHUB_ENV"
          echo "TAG=${{ matrix.adder }}-${{ matrix.period }}ns" >> "$GITHUB_ENV"

      - name: Run the Classic flow
        id: flow
        continue-on-error: true
        working-directory: files/alu/pd
        run: |
          set -o pipefail
          librelane --docker-no-tty --dockerized --run-tag "$TAG" --overwrite "$CONFIG" 2>&1 | tee flow.log

      - name: Collect results
        if: always()
        working-directory: files/alu/pd
        run: |
          python3 collect_run.py "runs/$TAG" "$GITHUB_WORKSPACE/out/$TAG"
          cp flow.log "$GITHUB_WORKSPACE/out/$TAG/flow.log" || true
          echo "${{ steps.flow.outcome }}" > "$GITHUB_WORKSPACE/out/$TAG/flow-outcome.txt"

      - name: Headless OpenROAD snapshots
        if: always() && matrix.period == '10'
        continue-on-error: true
        run: bash files/alu/pd/render_stages.sh "files/alu/pd/runs/$TAG" "out/$TAG/openroad-images"

      - name: Gate-level simulation of the routed netlist
        if: always() && matrix.period == '10'
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq iverilog
          bash files/alu/pd/gl_sim.sh "files/alu/pd/runs/$TAG" "out/$TAG/gl_sim.log"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: run-${{ env.TAG }}
          path: out/

  publish:
    needs: harden
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: collected
          pattern: run-*
          merge-multiple: true

      - name: Push to the reference-run branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan reference-run
          git rm -rf --quiet .
          cp -r collected/. .
          rm -rf collected
          {
            echo "# ASIC 101 reference PD runs"
            echo
            echo "Generated by .github/workflows/reference-run.yml from commit ${GITHUB_SHA}."
            echo "LibreLane ${LIBRELANE_VERSION}, SKY130A, sky130_fd_sc_hd. One folder per adder and clock period."
            echo "Layout files are gzipped. This branch is overwritten on every run."
          } > README.md
          git add -A
          git commit -q -m "Reference PD runs for ${GITHUB_SHA}"
          git push -f origin reference-run
